spring:
  config:
    activate:
      on-profile: preprod

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.mksdjnpmljjjrevywutt.supabase.co:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TicketForgePreprodHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${SUPABASE_PROJECT_ID:mksdjnpmljjjrevywutt}.supabase.co/auth/v1
          jwk-set-uri: https://${SUPABASE_PROJECT_ID:mksdjnpmljjjrevywutt}.supabase.co/auth/v1/.well-known/jwks.json

logging:
  level:
    root: INFO
    com.ticketforge: INFO
