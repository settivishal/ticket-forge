spring:
  config:
    activate:
      on-profile: staging

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 3000ms

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${SUPABASE_DB_USER:postgres.mksdjnpmljjjrevywutt}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TicketForgeStagingHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${SUPABASE_PROJECT_ID:mksdjnpmljjjrevywutt}.supabase.co/auth/v1
          jwk-set-uri: https://${SUPABASE_PROJECT_ID:mksdjnpmljjjrevywutt}.supabase.co/auth/v1/.well-known/jwks.json

logging:
  level:
    root: INFO
    com.ticketforge: INFO
