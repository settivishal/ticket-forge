services:
  - type: web
    name: ticketforge
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: PORT
        value: 8080
      - key: SUPABASE_PROJECT_ID
        value: mksdjnpmljjjrevywutt
      - key: SUPABASE_DB_URL
        value: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
      - key: SUPABASE_DB_USER
        value: postgres.mksdjnpmljjjrevywutt
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: REDISSON_ENABLED
        value: true
      - key: REDIS_SSL
        value: false
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: ticketforge-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: ticketforge-redis
          property: port

  - type: keyvalue
    name: ticketforge-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []   # internal network only
