services:
  - type: web
    name: ticketforge-staging
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: PORT
        value: 8080
      - key: SUPABASE_PROJECT_ID
        value: mksdjnpmljjjrevywutt
      - key: SUPABASE_DB_URL
        value: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
      - key: SUPABASE_DB_USER
        value: postgres.mksdjnpmljjjrevywutt
      - key: SUPABASE_DB_PASSWORD
        sync: false
