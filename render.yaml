services:
  - type: web
    name: ticketforge-staging
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: PORT
        value: 8080
      - key: SUPABASE_PROJECT_ID
        value: mksdjnpmljjjrevywutt
      - key: SUPABASE_DB_URL
        value: jdbc:postgresql://db.mksdjnpmljjjrevywutt.supabase.co:5432/postgres?sslmode=require
      - key: SUPABASE_DB_USER
        value: postgres
      - key: SUPABASE_DB_PASSWORD
        sync: false
