spring:
  config:
    activate:
      on-profile: dev

  cache:
    type: ${SPRING_CACHE_TYPE:simple}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  datasource:
    url: jdbc:h2:mem:ticketforge_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # In local dev: defaults to mock JWKS URI or dev Supabase if provided
          jwk-set-uri: ${SUPABASE_JWKS_URI:https://dummy.supabase.co/auth/v1/.well-known/jwks.json}

ticketforge:
  redisson:
    enabled: ${REDISSON_ENABLED:false}

logging:
  level:
    com.ticketforge: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
