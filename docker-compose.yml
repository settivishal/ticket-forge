services:
  app:
    build: .
    container_name: ticketforge_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUPABASE_DB_URL=jdbc:postgresql://postgres_db:5432/ticketforge_db
      - SUPABASE_DB_USER=postgres
      - SUPABASE_DB_PASSWORD=postgres
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres_db:
    image: postgres:16-alpine
    container_name: ticketforge_postgres
    environment:
      POSTGRES_DB: ticketforge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketforge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
